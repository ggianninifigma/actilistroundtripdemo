name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: actilist/package-lock.json

      # --- "After" app (live main) -> served at site root ---
      - name: Install dependencies (after)
        working-directory: actilist
        run: npm ci

      - name: Build after
        working-directory: actilist
        # Served from https://<user>.github.io/actilistroundtripdemo/
        env:
          BASE_PATH: /actilistroundtripdemo/
        run: npm run build

      # --- "Before" app (frozen pre-roundtrip copy) -> served at /before/ ---
      - name: Install dependencies (before)
        working-directory: pre-roundtrip
        run: npm ci

      - name: Build before
        working-directory: pre-roundtrip
        # Served from https://<user>.github.io/actilistroundtripdemo/before/
        env:
          BASE_PATH: /actilistroundtripdemo/before/
        run: npm run build

      # --- Assemble both builds into one site directory ---
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r actilist/dist/. _site/
          mkdir -p _site/before
          cp -r pre-roundtrip/dist/. _site/before/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages automatically on first run (source = GitHub Actions)
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
